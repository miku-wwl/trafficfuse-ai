[project]
name = "trafficfuse-ai"
version = "0.0.0"
description = "Evidence-Governed AI Release Circuit Breaker — consumer application for the pinned Agentic Intent Gate runtime (TechEx Amsterdam Hackathon 2026)."
readme = "README.md"
requires-python = ">=3.13"
license = { text = "MIT" }
dependencies = [
    # Backend foundation for the consumer application (Phase 0 brief, Step 3).
    "fastapi>=0.115",
    # Consumer-owned HTTP probes (read-only measurements) and TestClient.
    "httpx>=0.27",
    # Loads an optional local, git-ignored .env at startup. The process
    # environment always takes precedence (dotenv override=False); the file is
    # never executed as code. See src/trafficfuse/config/settings.py.
    "python-dotenv>=1.0",
    # Shared runtime, pinned to the immutable v0.2.0 release commit.
    # This is a Git release, not a PyPI publication; the exact commit SHA is
    # verified against the installed distribution by tests/test_runtime_dependency.py.
    # Never point this at a moving branch (AGENTS.md).
    "agentic-intent-gate @ git+https://github.com/miku-wwl/agentic-intent-gate.git@7261fdd2f47d2b15fabe8faac527eeee37338eb1",
]

[dependency-groups]
dev = [
    "pytest>=8,<9",
    # Required by fastapi.testclient.TestClient for the offline health smoke test.
    "uvicorn>=0.30",
    # Offline Kubernetes manifest validation in tests (no cluster contact).
    "pyyaml>=6.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.metadata]
# hatchling requires this opt-in because the pinned shared runtime is a
# direct Git reference in project.dependencies.
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["src/trafficfuse"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
