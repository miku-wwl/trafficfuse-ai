apiVersion: batch/v1
kind: Job
metadata:
  name: trafficfuse-probe
  namespace: trafficfuse-system
  labels:
    app.kubernetes.io/name: trafficfuse
    app.kubernetes.io/part-of: trafficfuse
    app.kubernetes.io/managed-by: trafficfuse-lab
    trafficfuse.io/owner: trafficfuse-lab
    trafficfuse.io/role: probe
  annotations:
    trafficfuse.io/manifest-source: deploy/lab/probe-job.yaml
    # Applied on demand (excluded from kustomization.yaml) so probes run only
    # when an operator starts a scenario. The probe is read-only: it performs
    # HTTP GETs against the live/version Services and writes JSON evidence.
    # Durable extraction (Phase 1A.1): the complete evidence document is also
    # printed to stdout between TRAFFICFUSE_EVIDENCE_BEGIN/END markers, so
    # `kubectl logs` yields verifiable evidence even if the emptyDir is lost.
    # Export offline with: python -m trafficfuse.lab.evidence_cli --logs <captured>
spec:
  backoffLimit: 0
  template:
    metadata:
      labels:
        app: trafficfuse
        trafficfuse.io/owner: trafficfuse-lab
        trafficfuse.io/role: probe
    spec:
      automountServiceAccountToken: false
      restartPolicy: Never
      containers:
        - name: probe
          image: trafficfuse-lab-service:phase1a
          imagePullPolicy: Never
          command: ["python", "-m", "trafficfuse.lab.probe_cli"]
          args:
            - --url
            - http://trafficfuse-live.trafficfuse-system.svc.cluster.local
            - --path
            - /checkout
            - --scenario-id
            - phase1b-live
            - --target-label
            - service:trafficfuse-live
            - --requests
            - "40"
            - --concurrency
            - "4"
            - --timeout
            - "5"
            - --output
            - /evidence/probe-live.json
          volumeMounts:
            - name: evidence
              mountPath: /evidence
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 128Mi
      volumes:
        - name: evidence
          emptyDir: {}
